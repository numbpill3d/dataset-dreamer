[project]
name = "dataset-dreamer"
version = "0.1.0"
description = "generative data augmentation conditioned on external signals. tabular/timeseries synthesis with cosmic rhythm awareness."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "voidrane", email = "void@nothing"}]
keywords = ["generative", "data-augmentation", "ctgan", "tvae", "normalizing-flows", "timeseries", "synthetic-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "ctgan>=0.7",
    "sdv>=1.7",
    "pyarrow>=14.0",
    "requests>=2.31",
    "httpx>=0.25",
    "ephem>=4.1",
    "gitpython>=3.1",
    "ccxt>=4.0",
    "typer>=0.9",
    "rich>=13.7",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "jinja2>=3.1",
    "websockets>=12.0",
    "orjson>=3.9",
    "polars>=0.19",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.6",
]
gpu = [
    "torch[cuda]>=2.1",
]
viz = [
    "plotly>=5.17",
    "dash>=2.14",
]

[project.scripts]
dreamer = "dataset_dreamer.cli.main:app"
dreamer-ui = "dataset_dreamer.ui.server:run"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "PL", "PT", "PTH", "RUF", "SIM", "T20", "TRY"]
ignore = ["S101", "PT004", "PT012"]
src = ["src"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"